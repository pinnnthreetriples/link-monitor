name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  GO_VERSION: "1.27.0"

jobs:
  # The program is Windows-only — tray, services, WebView2. Testing it on Linux
  # would test something that does not ship.
  test:
    name: tests (race + coverage)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      # The floor applies to the core only. The UI shell is glue that hollow
      # tests would "cover" without proving anything, so it carries no floor.
      - name: Core coverage floor (90%)
        shell: pwsh
        run: |
          go test ./internal/core/... -coverprofile=core.out -covermode=atomic
          $total = (go tool cover -func=core.out | Select-String 'total:').ToString()
          if ($total -notmatch '(\d+\.\d+)%') { throw "cannot read coverage from: $total" }
          $pct = [double]$Matches[1]
          Write-Host "core coverage: $pct%"
          if ($pct -lt 90) { throw "core coverage $pct% is below the 90% floor" }

  lint:
    name: lint, format, architecture
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go vet earns its own step: it caught a copylocks defect (a mutex copied
      # by value in a test table) that golangci-lint's configured set missed.
      - name: go vet
        run: go vet ./...

      # The pin has a floor, not just a version: golangci-lint embeds the Go
      # toolchain it was built with, and a build older than GO_VERSION cannot
      # read the newer export data. It does not fail loudly — the
      # type-checking linters degrade to nothing, one `level=error`
      # typechecking line is printed, "0 issues" is reported and the process
      # exits 7. v2.6.2 did exactly that against Go 1.27 ("export data version
      # 4 is greater than maximum supported version 2"), which is why this job
      # had never once passed. When GO_VERSION moves, this must move with it.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Every Windows-only file has an `_other.go` twin, so that a stray
      # syscall or a missing stub is a build failure rather than a surprise.
      # Nothing else checks them: the stubs only break when someone edits the
      # Windows side and forgets its counterpart. Linux is the whole of the
      # check — fyne.io/systray's darwin build needs cgo and an Apple SDK,
      # which is not worth a macOS runner for a program that ships on Windows.
      - name: the non-Windows stubs still compile
        env:
          GOOS: linux
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...

  security:
    name: security (gosec + govulncheck)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: build exe
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Every PR leaves a runnable exe behind, so the app can be tried on a
      # machine with no Go toolchain.
      - name: Build linkmon.exe
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o linkmon.exe ./cmd/linkmon

      - uses: actions/upload-artifact@v5
        with:
          name: linkmon-exe
          path: linkmon.exe
          if-no-files-found: error
