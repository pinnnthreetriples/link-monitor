name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"

jobs:
  # The program is Windows-only — tray, services, WebView2. Testing it on Linux
  # would test something that does not ship.
  test:
    name: tests (race + coverage)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      # bash, not the default pwsh: PowerShell mangles a native argument of the
      # form -flag=value, so `-coverprofile=coverage.out` never reaches go and
      # the profile is silently not written. The tests still run and pass, which
      # is what made it invisible until the floor step below tried to read the
      # file. Reproduced on windows-latest and locally in both PowerShell 5.1
      # and pwsh 7; bash on the same runner is correct.
      - name: Test with race detector
        shell: bash
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      # The floor applies to the core only. The UI shell is glue that hollow
      # tests would "cover" without proving anything, so it carries no floor.
      #
      # bash for the same reason as the step above, and the floor is asserted
      # rather than eyeballed: all four pure packages sit at 100 %, so a drop
      # to 89 % is a decision someone made, and this is where they hear about
      # it.
      - name: Core coverage floor (90%)
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/core/... -coverprofile=core.out -covermode=atomic
          total=$(go tool cover -func=core.out | awk '/^total:/ {print $NF}')
          echo "core coverage: ${total:-<nothing>}"
          case "$total" in
            *%) ;;
            *) echo "cannot read the total out of core.out" >&2; exit 1 ;;
          esac
          awk -v pct="${total%\%}" 'BEGIN {
            if (pct + 0 < 90) {
              printf "core coverage %s%% is below the 90%% floor\n", pct > "/dev/stderr"
              exit 1
            }
          }'

  lint:
    name: lint, format, architecture
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          $files = @(Get-ChildItem -LiteralPath frontend -Filter *.js -File)
          if ($files.Count -eq 0) { throw "no JavaScript files found" }
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($file.Name)" }
          }

      # go vet earns its own step: it caught a copylocks defect (a mutex copied
      # by value in a test table) that golangci-lint's configured set missed.
      - name: go vet
        run: go vet ./...

      # The pin has a floor, not just a version: golangci-lint embeds the Go
      # toolchain it was built with, and a build older than GO_VERSION cannot
      # read the newer export data. It does not fail loudly — the
      # type-checking linters degrade to nothing, one `level=error`
      # typechecking line is printed, "0 issues" is reported and the process
      # exits 7. v2.6.2 did exactly that against Go 1.27 ("export data version
      # 4 is greater than maximum supported version 2"), which is why this job
      # had never once passed. When GO_VERSION moves, this must move with it.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Every Windows-only file has an `_other.go` twin, so that a stray
      # syscall or a missing stub is a build failure rather than a surprise.
      # Nothing else checks them: the stubs only break when someone edits the
      # Windows side and forgets its counterpart. Linux is the whole of the
      # check — fyne.io/systray's darwin build needs cgo and an Apple SDK,
      # which is not worth a macOS runner for a program that ships on Windows.
      - name: the non-Windows stubs still compile
        env:
          GOOS: linux
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...

  security:
    name: security (gosec + govulncheck)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  build:
    name: build exe
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Every PR leaves a runnable exe behind, so the app can be tried on a
      # machine with no Go toolchain.
      - name: Generate exe icon resource
        run: go generate ./cmd/linkmon

      - name: Verify exe icon resource
        run: |
          if (-not (Test-Path -LiteralPath cmd/linkmon/rsrc_windows_amd64.syso -PathType Leaf)) {
            throw "generated exe icon resource is missing"
          }

      - name: Build linkmon.exe
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o linkmon.exe ./cmd/linkmon

      - uses: actions/upload-artifact@v7
        with:
          name: linkmon-exe
          path: linkmon.exe
          if-no-files-found: error
